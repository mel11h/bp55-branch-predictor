# BP55 (rtl/bp55.sv, v2) in place of Wally's predictor: 128-entry tagged BTB with
# 18-bit targets, TAGE (bimodal 512 + 3 x 64 tagged), 32-entry indirect target
# cache, 8-entry RAS; 8523 bits of tables. Integration: wally/patches/0002-bpred-bp55.patch;
# wally.sh copies rtl/bp55.sv to cvw/src/ifu/bpred/bp55.sv. BTB_SIZE, RAS_SIZE and
# BPRED_SIZE are not used by BP55.
BPRED_TYPE      cvw::BP_BP55
