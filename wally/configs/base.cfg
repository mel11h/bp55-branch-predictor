# Common base of every harness configuration: Wally rv32gc without compressed
# instructions, so that fetch, PC+4 and the BTB index match the RV32IM programs
# (built -march=rv32im) that the BP55 traces were made from. Everything else,
# including the caches, bus, F/D units and B/K extensions, is stock rv32gc; the
# integer-only programs never use the extra extensions.
base rv32gc
ZCA_SUPPORTED   0
ZCB_SUPPORTED   0
ZCF_SUPPORTED   0
ZCD_SUPPORTED   0
