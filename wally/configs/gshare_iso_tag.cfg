# gshare_iso_fix plus a 12-bit tag per BTB entry (BTB_TAG_BITS, wally/patches/0003):
# 128 x (32 + 4 + 12) = 6144 BTB bits, 8461 table bits in all, against BP55's 8523.
# Separates the effect of a tagged BTB from BP55's TAGE and indirect target cache.
define RAS_HINT_FIX
define BTB_TAG_BITS=12
BPRED_SIZE      32'd10
BTB_SIZE        32'd7
RAS_SIZE        32'd8
