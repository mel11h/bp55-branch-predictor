# CVA6's own predictor structures at BP55's budget (8523 bits), spent where they
# help CVA6 most: the bimodal BHT as in big (going to 4096 entries would cost
# 12288 bits), and the BTB doubled to 64 entries for the indirect jumps (calls
# are auipc+jalr in these programs, so the BTB also serves every call):
#   BHT 2048 x 3 = 6144, BTB 64 x 33 = 2112, RAS 8 x 33 = 264, total 8520 bits
BHTEntries 2048
BTBEntries 64
RASDepth   8
