# No dynamic predictor state: BHT, BTB and RAS sized 0 (frontend.sv has a
# generate branch for each). What remains is CVA6's predecode-time static
# prediction: conditional branches with a negative offset are predicted taken
# (BTFN), JAL is redirected in the frontend, every JALR (returns included)
# mispredicts in EX. config_pkg::check_cfg asserts RASDepth > 0 although
# frontend.sv has a RASDepth == 0 branch; cva6/patches/0003 removes that
# assertion (it holds for every other variant).
BHTEntries 0
BTBEntries 0
RASDepth   0
