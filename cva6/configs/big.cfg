# CVA6's own predictor structures enlarged to about BP55's 8132 bits
# (counted from the Verilated model, cva6/results/bits_big.txt):
#   BHT 2048 x (valid + 2-bit counter)           = 6144 bits
#   BTB   32 x (valid + 32-bit target), untagged = 1056 bits (indirect jumps only:
#        CVA6 computes branch and JAL targets from the decoded immediate, so its
#        BTB plays the role of BP55's 32-entry indirect target cache)
#   RAS    8 x (valid + 32-bit address)          =  264 bits (BP55: 8 entries)
#   total 7464 bits. Sizes must be powers of two; the next step up (BTB 64)
#   would be 8520 bits, above BP55's budget.
BHTEntries 2048
BTBEntries 32
RASDepth   8
