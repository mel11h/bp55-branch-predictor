# Common base of every CVA6 harness variant: cv32a60x (RV32, single issue,
# 4-entry scoreboard, 2 KB I$ and 2 KB write-through HPDcache) with compressed
# instructions disabled, so that the fetch word holds one instruction and the
# BHT/BTB index uses pc[..:2], as for the RV32IM programs (built -march=rv32im)
# the BP55 traces were made from. Zcb is a compressed extension and goes with C.
# Everything else is stock cv32a60x; B and the CV-X-IF example coprocessor stay
# enabled but are never exercised by the integer-only programs.
BASE_TARGET cv32a60x
RVC   0
RVZCB 0
