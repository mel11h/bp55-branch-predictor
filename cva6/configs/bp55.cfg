# BP55 (rtl/bp55.sv, copied unmodified into the build) in place of CVA6's BHT,
# BTB and RAS, looked up at CVA6's own prediction point (option A, see
# cva6/README.md and cva6/patches/0005). CVA6's own structures are sized 0;
# "BP55 1" makes cva6/cva6.sh add rtl/bp55.sv and +define+BP55_PRED.
BHTEntries 0
BTBEntries 0
RASDepth   0
BP55       1
